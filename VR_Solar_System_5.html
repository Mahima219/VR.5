<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VR Solar System</title>
<style>
:root{--ink:#edf5ff;--muted:#9eb4d6;--cyan:#16baff;--line:rgba(39,174,255,.62);--glass:rgba(3,13,31,.78);--bg:#02040c}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--ink);font:14px Inter,system-ui,Segoe UI,sans-serif;overflow:hidden}
canvas{display:block;touch-action:none}
#top{position:fixed;z-index:5;top:max(12px,env(safe-area-inset-top));left:14px;right:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;pointer-events:none}
.brand,.nav,.vrbox,.glass{background:linear-gradient(135deg,rgba(5,20,43,.9),rgba(2,9,23,.72));border:1px solid var(--line);box-shadow:0 0 22px rgba(0,153,255,.13),inset 0 0 18px rgba(0,125,255,.07);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.brand{padding:10px 17px;border-radius:15px;min-width:220px}
#top h1{margin:0;font-size:19px;letter-spacing:.2px}#top p{margin:3px 0 0;font-size:11px;color:var(--muted)}
.nav{display:flex;gap:5px;padding:5px;border-radius:30px;pointer-events:auto}
.nav button,.vrbox button,.dock button,.actions button,.glass button{border:1px solid transparent;border-radius:24px;background:transparent;color:var(--ink);padding:9px 13px;font:600 12px inherit;cursor:pointer;transition:.2s}
.nav button:hover,.nav button.active,.dock button.active,.actions button:hover,.glass button:hover{background:rgba(0,157,255,.2);border-color:rgba(28,180,255,.6);box-shadow:0 0 14px rgba(0,163,255,.25)}
.vrbox{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:30px;pointer-events:auto}
#vr{border:0;border-radius:22px;background:linear-gradient(90deg,#0878d8,#12c6ff);color:#fff;font-weight:800;padding:10px 15px;cursor:pointer}
#vr:disabled{background:#26385f;color:#9eafd0;cursor:wait}
#ctl{position:fixed;z-index:4;top:88px;right:14px;width:220px;padding:13px 15px;border-radius:16px;background:var(--glass);border:1px solid var(--line);box-shadow:0 0 24px rgba(0,153,255,.12);backdrop-filter:blur(12px);font-size:12px}
#ctl b,.eyebrow{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#72cfff}
#ctl label{display:block;margin-top:10px;color:var(--muted)}#ctl input[type=range]{width:100%;accent-color:#16baff}#ctl span{float:right;color:#fff}
#ctl .row{display:flex;gap:6px;margin-top:10px}#ctl button{flex:1;border:1px solid rgba(64,155,255,.25);border-radius:8px;background:#102746;color:#fff;padding:8px 4px;font-weight:600;cursor:pointer}
#planetCard{position:fixed;z-index:4;right:14px;top:50%;transform:translateY(-42%);width:min(300px,28vw);padding:17px;border-radius:19px;display:none}
.cardHead{display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(77,160,255,.25);padding-bottom:12px}
#planetOrb{width:58px;height:58px;border-radius:50%;flex:none;background:radial-gradient(circle at 32% 28%,#fff,#389dff 22%,#06316c 70%);box-shadow:0 0 20px #168dff}
#planetName{font-size:21px;font-weight:800}#planetType{font-size:11px;color:var(--muted);margin-top:3px}
#planetSummary{color:#d6e6fa;line-height:1.5;margin:12px 0}
#planetStats{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.stat{padding:8px;border-radius:9px;background:rgba(19,48,83,.62);min-width:0}
.stat small{display:block;color:#8caed5;font-size:9px;text-transform:uppercase;letter-spacing:.8px}.stat strong{display:block;font-size:12px;margin-top:3px;overflow-wrap:anywhere}
#planetFact{font-size:11px;color:#ffd88c;line-height:1.45;margin:12px 0 0}
#explore{width:100%;margin-top:13px;border:1px solid #13baff;background:rgba(0,143,255,.17);border-radius:20px;padding:10px;color:white;font-weight:700;cursor:pointer}
#dock{position:fixed;z-index:4;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:5px;padding:8px 12px;border-radius:28px;max-width:calc(100vw - 28px);overflow-x:auto}
.dockItem{min-width:62px;display:flex;flex-direction:column;align-items:center;gap:3px}
.dockItem button{width:47px;height:47px;border-radius:50%;padding:0;font-size:20px;background:radial-gradient(circle at 32% 25%,#fff7,#1685d7 34%,#06162d 76%);border:1px solid #4daeff}
.dockItem span{font-size:10px;color:#d9eaff}
#actions{position:fixed;z-index:4;left:14px;bottom:max(17px,env(safe-area-inset-bottom));display:flex;gap:7px;padding:8px;border-radius:16px}
#actions button{min-width:54px;font-size:11px;padding:8px}
#actions button span{display:block;font-size:19px;margin-bottom:2px}
#hint{position:fixed;z-index:3;left:50%;top:94px;transform:translateX(-50%);color:#a9c7eb;background:rgba(2,10,24,.48);border:1px solid rgba(65,154,255,.2);padding:7px 13px;border-radius:20px;font-size:11px;white-space:nowrap;pointer-events:none}
#panel{position:fixed;left:12px;bottom:12px;width:min(440px,92vw);display:none;border-radius:14px}
@media(max-width:850px){.nav{display:none}#ctl{top:auto;right:10px;bottom:100px;width:185px}#planetCard{top:86px;right:10px;transform:none;width:min(270px,54vw);padding:12px}#actions{left:8px;bottom:100px;flex-direction:column}#dock{bottom:10px;justify-content:flex-start}#hint{top:76px;font-size:10px}.brand{min-width:0;padding:8px 11px}#top h1{font-size:15px}}
@media(max-width:520px){#ctl{width:155px;font-size:10px;padding:9px}#planetCard{width:calc(100vw - 20px);top:76px;left:10px;right:10px;max-height:36vh;overflow:auto}#planetStats{grid-template-columns:repeat(4,minmax(0,1fr))}.stat{padding:6px}.stat strong{font-size:10px}#actions{display:none}#hint{max-width:90vw;overflow:hidden;text-overflow:ellipsis}}
body.in-vr #top,body.in-vr #ctl,body.in-vr #planetCard,body.in-vr #dock,body.in-vr #actions,body.in-vr #hint{display:none!important}
</style></head><body>
<div id="top">
 <div class="brand"><h1>✦ VR Solar System</h1><p>EXPLORE · LEARN · DISCOVER</p></div>

</div>

<input id="file" type="file" accept="audio/*" hidden></div>

['Ariel','uranus',1158,190900,2.52,'William Lassell, 1851','The brightest of Uranus’s major moons, crossed by canyons.',.32,6.8,'#c9ccd0'],

 return {...p,stats:[['Diameter',fmt(p.diam)+' km'],['From Sun',p.a+' AU'],['Year',p.period<700?fmt(p.period)+' d':(p.period/365.256).toFixed(1)+' yr'],
 ['Rotation',Math.abs(p.day)<2?Math.abs(p.day*24).toFixed(1)+' h':Math.abs(p.day)+' d'+(p.day<0?' retro':'')],['Gravity',p.g+' m/s²'],['Temp',p.temp+' °C'],['Moons',p.moons],['Mass',fmt(p.mass)+'e24 kg']]}};


// Premium flat-screen HUD; the same selection and camera actions remain available in VR.
const dock=$('dock'),card=$('planetCard');
const planetColors={sun:'#ff9b24',mercury:'#a99d91',venus:'#e8bb78',earth:'#278dff',mars:'#d86a4d',jupiter:'#d7a17c',saturn:'#d9bd88',uranus:'#75d7dc',neptune:'#416ee8'};
const planetGlyph={sun:'☀',mercury:'●',venus:'●',earth:'🌍',mars:'●',jupiter:'◉',saturn:'🪐',uranus:'●',neptune:'●'};
function buildDock(){
 dock.innerHTML='';
 [{id:'sun',name:'Sun'},...P.map(p=>({id:p.id,name:p.name}))].forEach(p=>{
  const item=document.createElement('div');item.className='dockItem';
  const b=document.createElement('button');b.type='button';b.title='Explore '+p.name;b.textContent=planetGlyph[p.id]||'●';
  b.style.background='radial-gradient(circle at 32% 25%,#fff8,'+planetColors[p.id]+' 34%,#06162d 78%)';

 });

function updateHud(id){
 const d=info(id);$('planetName').textContent=d.name;$('planetType').textContent=d.type;
 $('planetSummary').textContent=d.summary;$('planetFact').textContent='✦ '+d.fact;
 $('planetOrb').style.background='radial-gradient(circle at 32% 25%,#fff,'+(planetColors[id]||d.color||'#348cff')+' 35%,#06162d 78%)';
 $('planetStats').innerHTML='';
 (d.stats||[]).slice(0,8).forEach(s=>{const el=document.createElement('div');el.className='stat';const a=document.createElement('small'),b=document.createElement('strong');a.textContent=s[0];b.textContent=String(s[1]);el.append(a,b);$('planetStats').append(el)});

 document.querySelectorAll('.dockItem button').forEach((b,i)=>b.classList.toggle('active',(['sun',...P.map(p=>p.id)][i]===id)));

{const n=2500,a=new Float32Array(n*3);for(let i=0;i<n;i++){const v=new V3().randomDirection?0:0;const u=Math.random()*2-1,t=Math.random()*6.283,s=Math.sqrt(1-u*u);a.set([700*s*Math.cos(t),700*u,700*s*Math.sin(t)],i*3)}
const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(a,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:1.6,sizeAttenuation:false})))}
const hits=[],bodies=[];
const sunMesh=new THREE.Mesh(new THREE.SphereGeometry(8,96,64),new THREE.MeshBasicMaterial({map:sunTex()}));scene.add(sunMesh);
{const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d'),r=g.createRadialGradient(64,64,10,64,64,64);r.addColorStop(0,'rgba(255,200,80,.9)');r.addColorStop(1,'rgba(255,150,40,0)');g.fillStyle=r;g.fillRect(0,0,128,128);
const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),blending:THREE.AdditiveBlending,depthWrite:false}));s.scale.set(44,44,1);sunMesh.add(s)}
const sunHit=new THREE.Mesh(new THREE.SphereGeometry(10),new THREE.MeshBasicMaterial({visible:false}));sunHit.userData.id='sun';sunMesh.add(sunHit);hits.push(sunHit);
function tex(p){const c=document.createElement('canvas');c.width=256;c.height=128;const g=c.getContext('2d');g.fillStyle=p.color;g.fillRect(0,0,256,128);
 const gas=p.a>5;for(let i=0;i<(gas?40:70);i++){g.fillStyle=(Math.random()<.5?'rgba(255,255,255,':'rgba(0,0,0,')+(.05+Math.random()*.12)+')';
 if(gas)g.fillRect(0,Math.random()*128,256,3+Math.random()*10);else{g.beginPath();g.arc(Math.random()*256,Math.random()*128,2+Math.random()*10,0,7);g.fill()}}
 if(p.id==='earth'){g.fillStyle='rgba(60,170,80,.9)';for(let i=0;i<14;i++){g.beginPath();g.arc(Math.random()*256,20+Math.random()*90,8+Math.random()*14,0,7);g.fill()}}
 return new THREE.CanvasTexture(c)}
function label(t){const c=document.createElement('canvas');c.width=256;c.height=64;const g=c.getContext('2d');g.font='bold 34px system-ui,sans-serif';g.textAlign='center';g.fillStyle='#fff';g.fillText(t,128,44);
 return new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false,transparent:true}))}

// ---- realism helpers: NASA-based textures (local ./textures/<id>.jpg first, then CDN), tilt, atmosphere, rings, belt
const TILT={mercury:.03,venus:177.4,earth:23.4,mars:25.2,jupiter:3.1,saturn:26.7,uranus:97.8,neptune:28.3},clouds=[],aniso=renderer.capabilities.getMaxAnisotropy();
const B='https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/',T3='https://threejs.org/examples/textures/planets/';
const SRC={mercury:{map:[B+'mercurymap.jpg']},venus:{map:[B+'venusmap.jpg']},
earth:{map:[T3+'earth_atmos_2048.jpg',B+'earthmap1k.jpg'],normalMap:[T3+'earth_normal_2048.jpg'],specularMap:[T3+'earth_specular_2048.jpg']},
mars:{map:[B+'marsmap1k.jpg'],bumpMap:[B+'marsbump1k.jpg']},jupiter:{map:[B+'jupitermap.jpg']},saturn:{map:[B+'saturnmap.jpg']},

const ATM={venus:'#ffd9a0',earth:'#5aa8ff',mars:'#ff9a70',jupiter:'#e8c9a8',saturn:'#f3dfb0',uranus:'#9fe8ea',neptune:'#5f86ff'};
function loadTex(u,ok){const l=[...u];(function nx(){const s=l.shift();if(!s)return;new THREE.TextureLoader().setCrossOrigin('anonymous').load(s,t=>{t.anisotropy=aniso;ok(t)},undefined,nx)})()}

  const near=cp.distanceTo(b.g.position)<70,ms=Math.max(.8,s*.6);b.mons.forEach(o=>{o.ml.visible=near;o.ml.scale.set(ms*4,ms,1);o.ml.position.copy(o.mm.position);o.ml.position.y+=o.r+ms*.9})});

})();
